<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тур — NOMAD Journeys</title><meta name="description" content="Подробная страница путешествия">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css"></head><body data-page="tour"><main>
<div class="wrap" style="padding-top:28px"><div class="crumbs" id="crumbs" style="color:var(--mut)"></div><div id="tour"></div></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(10,20,15,.6);z-index:90;place-items:center;padding:20px"><div class="form" style="width:min(540px,100%);max-height:92vh;overflow:auto">
<div style="display:flex;justify-content:space-between;gap:10px"><div><h3 id="mTitle"></h3><p id="mSum" style="color:var(--mut);font-size:14px"></p></div><button id="mClose" style="background:0;border:0;font-size:26px;cursor:pointer;color:inherit">×</button></div>
<form id="bForm" style="display:grid;gap:14px"><label>Имя<input class="in" id="bName" required></label><label>Как с вами связаться (email, телефон или мессенджер)<input class="in" id="bContact" required></label><label>Пожелания и вопросы<textarea class="in" id="bComment" rows="3" placeholder="Питание, размещение, особенности здоровья"></textarea></label><button class="btn lg">Сформировать запрос</button>
<p style="font-size:12px;color:var(--mut)">Демо-режим: backend не подключён, запрос никуда не отправляется и не сохраняется.</p></form>
<div id="bOk" class="ok" style="display:none"><b>Запрос сформирован, но не отправлен.</b> Сейчас сайт не связан с backend. Так будет выглядеть структура запроса, которую получит менеджер или AI-консультант:<pre id="bPreview" class="pre"></pre></div></div></div>
</main><script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
